
spring.application.name=websuachuadientu

# Ket noi MySQL tren Aiven
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/repair_service?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:k642005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cau hinh JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cong chay tren Render
server.port=${PORT:8080}

# Cau hinh JWT
app.jwt.secret=${JWT_SECRET:ChangeThisJwtSecretKeyToSomethingLongAndSecureAtLeast32Chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Tai khoan admin
app.admin.email=${ADMIN_EMAIL:admin@repair.local}
app.admin.password=${ADMIN_PASSWORD:}
