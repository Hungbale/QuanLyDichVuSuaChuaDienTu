spring.application.name=websuachuadientu
spring.config.import=optional:file:.env[.properties]
spring.profiles.default=local

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/repair_service?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:repair_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Admin account is created on startup when ADMIN_PASSWORD is set.
app.admin.email=${ADMIN_EMAIL:admin@repair.local}
app.admin.password=${ADMIN_PASSWORD:}
