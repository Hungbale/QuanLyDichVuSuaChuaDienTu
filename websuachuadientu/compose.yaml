services:
  mysql:
    image: mysql:8.0
    container_name: repair-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-repair_service}
      MYSQL_USER: ${MYSQL_USER:-repair_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-repair123}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build: .
    container_name: repair-backend
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-repair_service}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-repair_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-repair123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@repair.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

    depends_on:
      - mysql

volumes:
  mysql_data:
